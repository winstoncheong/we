[package]
name = "we-server"
version = "0.3.0"
edition = "2024"

[lib]
name = "we_server"
path = "src/lib.rs"

[[bin]]
name = "we-server"
path = "src/main.rs"

[features]
# Embed web/dist into the binary (used by the desktop app).
embed = ["dep:include_dir"]

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
ignore = "0.4"
include_dir = { version = "0.7", optional = true }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "8"
