[package]
name = "we-server"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
ignore = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["fs"] }
